name: Android keyboard

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Rust bridge tests (host)
        run: cargo test -p app-android
      - name: Build the bridge for the JVM unit tests (host)
        run: cargo build -p app-android --release
      - name: Build the bridge for phones (cargo-ndk)
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o apps/android/app/src/main/jniLibs build -p app-android --release

      - name: Unit tests (golden fixtures through JNI)
        working-directory: apps/android
        env:
          HOST_LIB_DIR: ${{ github.workspace }}/target/release
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        working-directory: apps/android
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: |
          name=$(jq -r .appName brand.json | tr '[:upper:]' '[:lower:]')
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/${name}-keyboard-debug.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    # Only for version tags pushed by the owner: attaches the APK to the GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
