name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core and tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (whole workspace)
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -p app-core -p app-bench --all-targets -- -D warnings
      - name: Test (unit tests + golden fixtures)
        run: cargo test -p app-core -p app-bench

  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    env:
      # Short build path: the C++ speech engine build breaks past 260 characters.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> C:\\t"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the UI (type-check + bundle)
        run: pnpm --filter desktop build
      # CI has no graphics card, so the processor-only build is checked here.
      - name: Lint
        run: cargo clippy -p app-asr -p app-desktop --no-default-features --all-targets -- -D warnings
      - name: Test (state machine, clipboard, database, rules, audio helpers)
        run: cargo test -p app-asr -p app-desktop --no-default-features --lib

  core-portability:
    name: Core builds for web and Android targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p app-core --target wasm32-unknown-unknown
      - run: cargo check -p app-core --target aarch64-linux-android
      - run: cargo check -p app-core --target armv7-linux-androideabi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the whole history on every run (the gitleaks action cannot handle a
      # repository's first commit).
      - name: Scan full history with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1

  # Android unit tests are added with the keyboard (Stage 5).
