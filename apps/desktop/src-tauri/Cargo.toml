[package]
name = "app-desktop"
description = "Windows desktop app: system-wide dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "app-desktop"

[lib]
name = "app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gpu", "custom-protocol"]
# Vulkan GPU acceleration for whisper.cpp. Needs the Vulkan SDK at build time.
gpu = ["app-asr/vulkan"]
# Embeds the built screens (apps/desktop/dist) in the program. Without it the windows try
# to load the development server at localhost:1420 and stay blank. Run `pnpm build` in
# apps/desktop before `cargo build`.
custom-protocol = ["tauri/custom-protocol"]
# Developer tools (ai-eval). Off by default so they are not shipped in the installer.
dev-tools = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { path = "../../../crates/core" }
app-asr = { path = "../../../crates/asr" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "ai-eval"
path = "src/bin/ai-eval.rs"
test = false
required-features = ["dev-tools"]

[[bin]]
name = "asr-eval"
path = "src/bin/asr-eval.rs"
test = false
required-features = ["dev-tools"]

[[bin]]
name = "layout-eval"
path = "src/bin/layout-eval.rs"
test = false
required-features = ["dev-tools"]
