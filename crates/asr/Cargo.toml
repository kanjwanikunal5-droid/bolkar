[package]
name = "app-asr"
description = "Local speech recognition engines (desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# GPU acceleration through Vulkan. Needs the Vulkan SDK at build time.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
whisper-rs = "0.16"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "wav", "pcm"] }
symphonia-adapter-libopus = "0.2"
# Opus encoder (already built for the decoder above): compresses audio before cloud upload.
opusic-sys = "0.7"
regex.workspace = true
serde.workspace = true

[[bin]]
name = "rtf"
path = "src/bin/rtf.rs"
test = false

[[bin]]
name = "batch"
path = "src/bin/batch.rs"
test = false
